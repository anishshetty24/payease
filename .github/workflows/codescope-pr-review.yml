# CodeScope AI — hosted, non-blocking lexical PR diff review.
# Reads GitHub PR patches only. Never checks out, installs, or executes PR code.
# Does NOT run the user's full local CodeScope AST/call-graph/Ollama backend.
name: CodeScope AI — Hosted PR Diff Review

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pull_number:
        description: 'Existing GitHub pull request number'
        required: true
        default: '1'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/codescope-pr-review.yml'
      - '.github/scripts/codescope_hosted_pr_review.py'

permissions:
  contents: read
  pull-requests: read

jobs:
  hosted-pr-review:
    name: Non-blocking, evidence-limited PR diff review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      CODESCOPE_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_number || '1' }}
      CODESCOPE_OUTPUT_DIR: codescope-ci-output
    steps:
      - name: Check out trusted analyzer only (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/codescope_hosted_pr_review.py
          sparse-checkout-cone-mode: false

      - name: Analyze added PR lines without executing PR code
        run: python3 .github/scripts/codescope_hosted_pr_review.py

      - name: Upload Markdown and JSON review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codescope-pr-report
          path: codescope-ci-output/
          if-no-files-found: error
          retention-days: 14
