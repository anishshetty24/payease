# CodeScope AI Milestone 15 — safe GitHub Actions artifact verification.
# This hosted runner CANNOT access your local 127.0.0.1 CodeScope backend.
# It verifies PR metadata + report/artifact delivery, not source risk scoring.
name: CodeScope AI — PR report artifact check

on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: 'Existing GitHub pull request number'
        required: true
        type: string
        default: '1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/codescope-pr-review.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  report-artifact-check:
    name: Read-only PR metadata and artifact verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_PR: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_number || '1' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Produce clearly labeled non-analysis reports
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          from pathlib import Path
          import re
          import urllib.error
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          raw_number = os.environ.get('TARGET_PR', '')
          output = Path(os.environ['GITHUB_WORKSPACE']) / 'codescope-ci-output'
          output.mkdir(exist_ok=True)
          status = {
              'schema_version': 1,
              'status': 'not_analyzed',
              'repository': repo,
              'pull_number': None,
              'metadata_verified': False,
              'head_sha': None,
              'base_sha': None,
              'score': None,
              'band': 'not_analyzed',
              'score_status': 'local_backend_not_connected',
              'findings': None,
              'non_blocking': True,
              'runtime_verified': False,
              'message': 'GitHub Actions verified report delivery only; CodeScope source analysis did not run.',
          }
          title = 'Unavailable'
          link = None
          state = 'Unavailable'
          if re.fullmatch(r'[1-9][0-9]{0,8}', raw_number):
              number = int(raw_number)
              status['pull_number'] = number
              url = f'https://api.github.com/repos/{repo}/pulls/{number}'
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'CodeScope-CI-Metadata-Check',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      data = json.load(response)
                  if not isinstance(data, dict) or not isinstance(data.get('head'), dict) or not isinstance(data.get('base'), dict):
                      raise ValueError('Unexpected PR metadata schema')
                  status['metadata_verified'] = True
                  status['head_sha'] = data['head'].get('sha')
                  status['base_sha'] = data['base'].get('sha')
                  status['changed_files'] = data.get('changed_files')
                  link = f'https://github.com/{repo}/pull/{number}'
                  title = str(data.get('title') or 'Untitled').replace('\n', ' ').replace('\r', ' ')
                  state = str(data.get('state') or 'unknown')
              except (urllib.error.URLError, ValueError, KeyError) as error:
                  status['message'] = f'GitHub PR metadata could not be verified ({type(error).__name__}); no CodeScope analysis ran.'
          else:
              status['message'] = 'Invalid PR number; no CodeScope analysis ran.'

          safe_title = html.escape(title, quote=False).replace('|', '\\|')
          lines = [
              '# CodeScope AI — GitHub Actions connectivity report',
              '',
              f'- **Repository:** `{repo}`',
              f'- **PR:** ' + (f'[#{status["pull_number"]}]({link}) — {safe_title}' if link else 'Unavailable'),
              f'- **GitHub state:** {state}',
              f'- **GitHub metadata verified:** {str(status["metadata_verified"]).lower()}',
              f'- **Head SHA:** `{status["head_sha"] or "unavailable"}`',
              f'- **Base SHA:** `{status["base_sha"] or "unavailable"}`',
              '',
              '## CodeScope source analysis',
              '',
              '**NOT ANALYZED.** This GitHub-hosted runner cannot reach the private',
              '`http://127.0.0.1:8000` CodeScope backend on a Windows computer.',
              'No static findings, score, tests, or AI prioritization were produced.',
              'This outcome is not evidence that the PR is safe or unsafe.',
              '',
              'No PR code was checked out or executed, and no GitHub comments were posted.',
          ]
          markdown = '\n'.join(lines) + '\n'
          (output / 'codescope-pr-review.md').write_text(markdown, encoding='utf-8')
          (output / 'codescope-ci-status.json').write_text(json.dumps(status, indent=2) + '\n', encoding='utf-8')
          summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_file:
              with open(summary_file, 'a', encoding='utf-8') as summary:
                  summary.write(markdown)
          print('CodeScope CI: GitHub metadata verified:', status['metadata_verified'])
          print('CodeScope CI status: not_analyzed (no local backend connection)')
          PY
      - name: Upload Markdown and JSON evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codescope-pr-report
          path: codescope-ci-output/
          if-no-files-found: error
          retention-days: 14
